name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '6.4.*' }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.4.*' }
          - { php: '8.3', symfony: '6.4.*' }
          - { php: '8.3', symfony: '7.4.*' }
          - { php: '8.4', symfony: '6.4.*' }
          - { php: '8.4', symfony: '7.4.*', coverage: true }
          - { php: '8.4', symfony: '8.0.*' }
          - { php: '8.4', symfony: '8.1.*' }
          - { php: '8.5', symfony: '7.4.*' }
          - { php: '8.5', symfony: '8.0.*' }
          - { php: '8.5', symfony: '8.1.*' }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@9a96576163ad88ed6f6f2cbf381c5229baf95677 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Select Symfony ${{ matrix.symfony }}
        run: composer require symfony/framework-bundle:${{ matrix.symfony }} symfony/form:${{ matrix.symfony }} symfony/security-csrf:${{ matrix.symfony }} symfony/yaml:${{ matrix.symfony }} --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Check for security vulnerabilities
        run: composer audit --no-interaction

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: composer test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Qlty
        if: ${{ matrix.coverage }}
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: coverage.xml

      - name: Check coding standards
        run: composer lint
