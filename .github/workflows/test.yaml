name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '6.4.*' }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.4.*' }
          - { php: '8.3', symfony: '6.4.*' }
          - { php: '8.3', symfony: '7.4.*' }
          - { php: '8.4', symfony: '6.4.*' }
          - { php: '8.4', symfony: '7.4.*', coverage: true }
          - { php: '8.4', symfony: '8.0.*' }
          - { php: '8.4', symfony: '8.1.*' }
          - { php: '8.5', symfony: '7.4.*' }
          - { php: '8.5', symfony: '8.0.*' }
          - { php: '8.5', symfony: '8.1.*' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Select Symfony ${{ matrix.symfony }}
        run: composer require symfony/framework-bundle:${{ matrix.symfony }} symfony/form:${{ matrix.symfony }} symfony/security-csrf:${{ matrix.symfony }} symfony/yaml:${{ matrix.symfony }} --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Check for security vulnerabilities
        run: composer audit --no-interaction

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: composer test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coding standards
        run: composer lint
