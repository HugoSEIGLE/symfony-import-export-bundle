version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"

    open-pull-requests-limit: 5

    groups:
      symfony:
        patterns:
          - "symfony/*"

      doctrine:
        patterns:
          - "doctrine/*"

      development-tools:
        dependency-type: "development"
        patterns:
          - "phpunit/*"
          - "phpstan/*"
          - "friendsofphp/*"
          - "phpro/*"
          - "ergebnis/*"

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Paris"

    open-pull-requests-limit: 5

    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "chore(ci)"

    labels:
      - "dependencies"